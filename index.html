<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prototipo navegable · App de tareas con IA</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#1b2433;--mut:#5b6678;--pri:#2457a6;--bd:#d7dde8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10141c;--card:#1a2130;--tx:#e8ecf4;--mut:#9aa6ba;--pri:#6c9be0;--bd:#2c364a}}
:root[data-theme=dark]{--bg:#10141c;--card:#1a2130;--tx:#e8ecf4;--mut:#9aa6ba;--pri:#6c9be0;--bd:#2c364a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;gap:24px;padding:16px;justify-content:center}
aside{width:280px;flex:none;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;overflow-y:auto;max-height:calc(100vh - 32px)}
aside h1{font-size:16px;margin:0 0 4px}aside p{color:var(--mut);margin:0 0 12px;font-size:12.5px}
.t{display:block;width:100%;text-align:left;background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:9px 11px;margin:0 0 8px;cursor:pointer;font:inherit}
.t:hover,.t.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,transparent)}
.t b{display:block;color:var(--pri);font-size:12px}.t small{color:var(--mut);font-size:11.5px}
.sb{display:block;width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:none;color:var(--tx);cursor:pointer;font:inherit;margin:6px 0 0}
aside label{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12.5px;cursor:pointer}
#ph{width:390px;height:min(800px,calc(100vh - 32px));background:#fff;color:#1b2433;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;position:relative;flex:none;font-size:14px}
#ph *{font-family:inherit}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #eef0f4;font-weight:700;font-size:16px;color:#1b2433;flex:none}
.top .ti{flex:1}.top>button{background:none;border:0;color:#2457a6;cursor:pointer;display:flex;padding:0}
.top svg{color:#2457a6}.av{width:30px;height:30px;border-radius:50%;background:#1e4a8f;display:flex;align-items:center;justify-content:center}.av svg{color:#fff}
#sc{flex:1;overflow:auto;padding:14px 16px 20px}
#ph h2{margin:0 0 6px;font-size:20px}#ph h3{margin:16px 0 8px;font-size:15px}#ph p{margin:4px 0}
.mut{color:#5b6678;font-size:12px}.cp{text-transform:capitalize}.cen{text-align:center}
.card{border:1px solid #cfd6e3;border-radius:10px;padding:12px;margin:0 0 10px;background:#fff}.card.f{border-color:#2457a6;box-shadow:0 0 0 1px #2457a6}
.row{display:flex;align-items:flex-start;gap:8px}.sp{flex:1}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid;display:inline-block}
.Alta{background:#fff1ee;color:#c2410c;border-color:#f4a58b}.Media{background:#fef3c7;color:#92600a;border-color:#e8c25a}.Baja{background:#e8f8ee;color:#15803d;border-color:#8fd3a6}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border-radius:9px;border:1px solid #2457a6;background:#2457a6;color:#fff;font-weight:600;cursor:pointer;font-size:14px;margin:0 0 8px}
.btn.o{background:#fff;color:#2457a6}.btn.s{padding:7px;font-size:12.5px;margin:0}.btn.l{border:0;background:none;color:#2457a6}
.ib{background:none;border:0;cursor:pointer;padding:0;display:flex}
.cb{width:20px;height:20px;border:2px solid #9aa6ba;border-radius:5px;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff;padding:0;margin-top:1px}.cb.on{background:#2457a6;border-color:#2457a6}
.bar{height:6px;border-radius:4px;background:#e3e8f1;overflow:hidden}.bar i{display:block;height:100%;background:#2457a6;transition:width .3s}
.in{width:100%;padding:11px;border:1px solid #b9c3d6;border-radius:8px;font-size:14px;background:#fff;color:#1b2433;font-family:inherit}.in.e{border-color:#d92d20}.er{color:#d92d20;font-size:12px;margin-top:4px}
.lb{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
.chips{display:flex;gap:8px}.chips button{flex:1;padding:10px 0;border-radius:8px;border:1.5px solid;font-weight:700;font-size:12px;cursor:pointer;opacity:.55}.chips button.on{opacity:1;box-shadow:0 0 0 2px #2457a6}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:13px;border:1px solid #cfd6e3;border-radius:9px;margin:0 0 8px;background:#fff;cursor:pointer;font-size:14px;color:#1b2433;text-align:left}.opt.on{border-color:#2457a6;background:#eef4ff}
.rd{width:18px;height:18px;border:2px solid #9aa6ba;border-radius:50%;flex:none}.on>.rd{border-color:#2457a6;background:radial-gradient(#2457a6 45%,#fff 50%)}
.hint{background:#eef4ff;border-radius:10px;padding:10px;font-size:12px;color:#44506a;margin:14px 0}
.nav{display:flex;border-top:1px solid #e3e8f1;flex:none}.nav button{flex:1;padding:9px;background:none;border:0;color:#6b778c;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}.nav .on{color:#2457a6;font-weight:700}
.toast{background:#e8f8ee;border:1px solid #15803d;color:#15803d;padding:10px;border-radius:8px;margin:0 0 10px;font-weight:600}
.ov{position:absolute;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.ov .card{padding:18px;width:100%;margin:0}
.fab{position:sticky;bottom:-8px;padding-top:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px;font-size:13px}.cal b{font-size:11px;color:#6b778c}
.cal button{border:0;background:none;padding:4px 0;border-radius:50%;cursor:pointer;color:#1b2433;font-size:13px;min-height:38px}.cal .td{outline:2px solid #2457a6}.cal .sl{background:#1b2433;color:#fff}.cal small{display:block;font-size:9px;color:#2457a6;height:10px}.cal .sl small{color:#fff}
.spin{width:44px;height:44px;border:4px solid #dbe5f7;border-top-color:#2457a6;border-radius:50%;animation:sp 1s linear infinite;margin:120px auto 16px}@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:820px){body{flex-direction:column;padding:8px;gap:8px}aside{width:auto;max-height:30vh;flex:none}#ph{width:100%;max-width:420px;margin:0 auto;height:auto;flex:1;min-height:440px}}
</style></head><body>
<aside>
<h1>App de tareas con IA</h1>
<p>Prototipo funcional. Elige una tarea para empezar y úsalo como una app real: escribe, marca, guarda, edita y elimina.</p>
<div id="tl"></div>
<label><input type="checkbox" id="fl"> La IA falla en el próximo intento</label>
<button class="sb" id="sim">🔔 Simular aviso de tarea</button>
<button class="sb" id="rs">↺ Reiniciar datos</button>
</aside>
<div id="ph"></div>
<script>
const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,'0');
const TODAY='2026-10-26',DN=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],MN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dt=i=>new Date(i+'T12:00:00'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=i=>i?i.split('-').reverse().join('/'):'',lng=i=>{const d=dt(i);return DN[d.getDay()]+' '+d.getDate()+' de '+MN[d.getMonth()]};
const dto=i=>Math.round((dt(i)-dt(TODAY))/864e5),add=(i,n)=>{const d=dt(i);d.setDate(d.getDate()+n);return iso(d)};
const dias=n=>n+(n===1?' día':' días'),due=d=>{const n=dto(d);return n===0?'Vence hoy':n===1?'Vence mañana':n<0?'Venció hace '+dias(-n):'Vence en '+dias(n)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AV=[['none','Sin aviso'],['1d','1 día antes','a las 9:00'],['2d','2 días antes','a las 9:00'],['c','A elección']];
const avl=t=>t.av==='c'?(t.ac?'El '+fmt(t.ac)+' a las 9:00':'A elección'):(AV.find(a=>a[0]===t.av)||AV[0])[1]+(t.av==='none'||!t.av?'':' (9:00)');
const ORD={Alta:0,Media:1,Baja:2},byP=(a,b)=>ORD[a.df]-ORD[b.df]||a.d.localeCompare(b.d);
const P={back:'M15 18l-6-6 6-6',trash:'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6',edit:'M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z',bell:'M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4',cal:'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4',check:'M20 6L9 17l-5-5',plus:'M12 5v14M5 12h14',user:'M20 21a8 8 0 10-16 0M12 11a4 4 0 100-8 4 4 0 000 8',spark:'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z',search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5',home:'M9 12l2 2 4-4M12 3a9 9 0 100 18 9 9 0 000-18'};
const ic=(n,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
const seed=()=>[{id:1,n:'Preparar presentación',d:'2026-10-27',df:'Media',av:'1d',done:0,est:'45 min'},{id:2,n:'Estudiar para parcial',d:'2026-10-28',df:'Alta',av:'1d',done:0,est:''},{id:3,n:'Entregar informe de usabilidad',d:'2026-10-30',df:'Alta',av:'1d',done:0,est:''},{id:4,n:'Enviar informe',d:'2026-10-26',df:'Baja',av:'none',done:1,est:''},{id:5,n:'Entregar TP',d:'2026-10-28',df:'Baja',av:'none',done:1,est:''}];
let tasks=null;try{tasks=JSON.parse(localStorage.getItem('tt1'))}catch(e){}if(!tasks)tasks=seed();
const sv=()=>{try{localStorage.setItem('tt1',JSON.stringify(tasks))}catch(e){}},nid=()=>Math.max(0,...tasks.map(t=>t.id))+1,gt=id=>tasks.find(x=>x.id==id);
const SUG=[['Parcial este viernes','Tengo parcial de Álgebra este viernes'],['TP grupal','Tengo que entregar un TP grupal el lunes']];
let S={scr:'hoy',hist:[],draft:{},editing:0,sel:0,toast:'',modal:0,cal:{y:2026,m:9,sel:'2026-10-28'},ia:{text:'',auto:true},prop:null,fail:false,ctx:'task',errs:{},pv:'',alertId:3},tm,ls='';

function mk(x,auto){const l=x.toLowerCase();let df=/parcial|examen|final|proyecto|entrega/.test(l)?'Alta':/tp|trabajo|present|informe|expos/.test(l)?'Media':'Baja',d;
 const W={domingo:0,lunes:1,martes:2,miércoles:3,miercoles:3,jueves:4,viernes:5,sábado:6,sabado:6};
 if(/mañana/.test(l))d=add(TODAY,1);else if(/\bhoy\b/.test(l))d=TODAY;else{const m=l.match(/(\d{1,2})\/(\d{1,2})/);if(m)d='2026-'+pad(m[2])+'-'+pad(m[1]);else{let b=null;for(const k in W){const i=l.indexOf(k);if(i>=0&&(!b||i<b[0]))b=[i,k]}d=add(TODAY,b?((W[b[1]]-dt(TODAY).getDay()+7)%7)||7:7)}}
 let n=x.trim().split(/[.;\n]| y debo | y tengo /i)[0].replace(/^(tengo que|tengo|debo|necesito|quiero)\s+/i,'').trim();n=n.charAt(0).toUpperCase()+n.slice(1);if(n.length>50)n=n.slice(0,47)+'…';
 const ai=df;if(!auto)df='Media';return{n,d,df,ai,av:df==='Alta'?'2d':df==='Media'?'1d':'none',ac:'',manual:!auto}}

const head=(t,o)=>`<div class="top">${o.back?`<button data-a="back">${ic('back',20)}</button>`:o.home?ic('home',20):''}<span class="ti">${t}</span>${o.home?ic('search',18):''}<span class="av">${ic('user',15)}</span></div>`;
const nav=a=>`<div class="nav"><button class="${a==='hoy'?'on':''}" data-a="tab:hoy">${ic('home',20)}Hoy</button><button class="${a==='cal'?'on':''}" data-a="tab:cal">${ic('cal',20)}Calendario</button></div>`;
const tk=(t,first)=>`<div class="card${first?' f':''}">${first?'<div class="mut" style="color:#2457a6;font-weight:700;margin-bottom:6px">▶ Empieza por esta</div>':''}<div class="row"><button class="cb${t.done?' on':''}" data-a="tog:${t.id}">${t.done?ic('check',13):''}</button><div class="sp"><b style="${t.done?'text-decoration:line-through;color:#6b778c':''}">${esc(t.n)}</b><div class="mut">Dificultad: ${t.df} · ${t.done?'Completada':'Aviso: '+avl(t)}${t.est&&!t.done?' · Tiempo estimado: '+t.est:''}</div></div><span class="tag ${t.df}">${t.df.toUpperCase()}</span><button class="ib" style="color:#d92d20" data-a="del:${t.id}">${ic('trash')}</button></div><div class="row" style="margin-top:10px"><button class="btn o s" data-a="det:${t.id}">${ic('eye',14)} Ver detalle</button><button class="btn o s" data-a="edit:${t.id}">${ic('edit',14)} Editar</button></div></div>`;
const modal=()=>{const t=gt(S.modal);return t?`<div class="ov"><div class="card"><b style="font-size:16px">¿Eliminar esta tarea?</b><p class="mut">Esta acción quitará la tarea de tu lista de forma permanente.</p><div class="card" style="background:#eef4ff;margin-top:10px"><b>${esc(t.n)}</b><div class="mut">Fecha límite: ${fmt(t.d)}</div></div><button class="btn" data-a="mc">Cancelar</button><button class="btn l" style="color:#d92d20" data-a="mdel">${ic('trash',14)} Eliminar</button></div></div>`:''};

const SC={
hoy(){const p=tasks.filter(t=>!t.done).sort(byP),c=tasks.filter(t=>t.done),n=tasks.length,pc=n?Math.round(c.length/n*100):0;
return['Hoy',`<h2>Hoy · ${lng(TODAY)}</h2><div class="row mut"><span class="sp">Progreso del día: ${c.length} de ${n} completadas</span><b>${pc}%</b></div><div class="bar"><i style="width:${pc}%"></i></div><h3>Pendientes <span class="mut">${p.length} tareas</span></h3>${p.map((t,i)=>tk(t,i===0)).join('')||'<p class="mut">No tienes tareas pendientes 🎉</p>'}<h3>Completadas</h3>${c.map(t=>tk(t)).join('')||'<p class="mut">Aún no completaste ninguna.</p>'}<div class="fab"><button class="btn" data-a="add">${ic('plus')} Añadir tarea</button></div>`,{nav:'hoy',home:1}]},
cal(){const{y,m,sel}=S.cal,off=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<off;i++)cells+='<span></span>';
 for(let d=1;d<=nd;d++){const k=y+'-'+pad(m+1)+'-'+pad(d),c=tasks.filter(t=>t.d===k).length;cells+=`<button class="${k===TODAY?'td ':''}${k===sel?'sl':''}" data-a="day:${k}">${d}<small>${c?'•'+c:''}</small></button>`}
 const L=tasks.filter(t=>t.d===sel);
 return['Calendario',`<h2>Calendario</h2><div class="row cp" style="align-items:center;margin:10px 0"><button class="btn l" style="width:auto;margin:0" data-a="cm:-1">‹ ${MN[(m+11)%12]}</button><b class="sp cen">${MN[m]} ${y}</b><button class="btn l" style="width:auto;margin:0" data-a="cm:1">${MN[(m+1)%12]} ›</button></div><div class="cal">${'LMMJVSD'.split('').map(x=>`<b>${x}</b>`).join('')}${cells}</div><h3>${lng(sel)} <span class="mut">${L.length} tareas programadas</span></h3>${L.map(t=>`<div class="card"><b>${esc(t.n)}</b><div style="margin:6px 0"><span class="tag" style="background:#e6efff;color:#2457a6;border-color:#bcd0f5">${t.done?'Completado':'Pendiente'}</span> <span class="tag ${t.df}">Dificultad ${t.df}</span></div><button class="btn o s" data-a="det:${t.id}">Ver detalle →</button></div>`).join('')||'<p class="mut">Sin tareas este día.</p>'}<div class="fab" style="text-align:right"><button class="btn" style="width:48px;height:48px;border-radius:50%;display:inline-flex;margin:0" data-a="addc">${ic('plus',22)}</button></div>`,{nav:'cal'}]},
form(){const d=S.draft,e=S.errs,ed=S.editing;
 return[ed?'Editar tarea':'Nueva tarea',`${ed?'':`<button class="btn o s" data-a="ia" style="margin-bottom:6px">${ic('spark',14)} Crear con IA</button>`}<h2>${ed?'Editar tarea':'Nueva tarea'}</h2><label class="lb">Nombre *</label><input class="in${e.n?' e':''}" data-k="n" value="${esc(d.n)}" placeholder="Ej.: Estudiar para parcial">${e.n?'<div class="er">Escribe un nombre</div>':''}<label class="lb">Fecha límite *</label><input type="date" class="in${e.d?' e':''}" data-k="d" value="${d.d||''}">${e.d?'<div class="er">Elige una fecha</div>':''}<label class="lb">Dificultad</label><div class="chips">${['Alta','Media','Baja'].map(x=>`<button class="${x}${d.df===x?' on':''}" data-a="df:${x}">${x.toUpperCase()}</button>`).join('')}</div><label class="lb">Aviso</label><button class="opt" data-a="aviso">${ic('bell',15)}<span class="sp">${avl(d)}</span>⌄</button><div class="hint">💡 Configura un aviso temprano para evitar bloqueos el día de entrega.</div><button class="btn" data-a="save">${ed?'Guardar cambios':'Guardar tarea'}</button><button class="btn o" data-a="back">Cancelar</button>`,{back:1}]},
aviso(){const d=S.draft;return['Aviso',`<h2>Aviso</h2><p class="mut">Configura cuándo deseas recibir un recordatorio para esta entrega académica.</p><div style="height:8px"></div>${AV.map(a=>`<button class="opt${d.av===a[0]?' on':''}" data-a="av:${a[0]}"><span>${a[1]}${a[2]?` <small class="mut">(${a[2]})</small>`:''}</span><i class="rd"></i></button>`).join('')}${d.av==='c'?`<label class="lb">Fecha del aviso</label><input type="date" class="in" data-k="ac" value="${d.ac||''}">`:''}<button class="btn" style="margin-top:12px" data-a="back">Listo</button><button class="btn o" data-a="avc">Cancelar</button>`,{back:1}]},
detalle(){const t=gt(S.sel);if(!t)return SC.hoy();const n=dto(t.d);
 return['Detalle de tarea',`<div class="row"><h2 class="sp">Detalle de tarea</h2><span class="tag" style="background:#e6efff;color:#2457a6;border-color:#bcd0f5">${t.done?'Completada':'Pendiente'}</span></div><div class="card"><b style="font-size:16px">${esc(t.n)}</b>${t.est?`<div class="mut" style="margin-top:6px">✨ Estimación recomendada: bloques de ${t.est}</div>`:''}</div><h3>Fecha límite</h3><div class="card" style="background:#eef4ff">${ic('cal',15)} <b>${fmt(t.d)}</b><div class="mut">${n>=0?'Quedan '+dias(n)+' para la entrega':'Venció hace '+dias(-n)}</div></div><h3>Dificultad</h3><div class="card row" style="background:#eef4ff;align-items:center"><span class="tag ${t.df}">${t.df}</span><span class="sp"></span><button class="btn l" style="width:auto;margin:0" data-a="prio">Cambiar</button></div><h3>Aviso</h3><div class="card" style="background:#eef4ff">${ic('bell',15)} ${avl(t)}</div><button class="btn" data-a="tog2:${t.id}">${ic('check',15)} ${t.done?'Marcar como pendiente':'Marcar como hecha'}</button><button class="btn o" data-a="edit:${t.id}">${ic('edit',15)} Editar tarea</button><button class="btn l" style="color:#d92d20" data-a="del:${t.id}">${ic('trash',15)} Eliminar</button>`,{back:1}]},
prio(){const p=S.ctx==='prop',nm=p?S.prop.n:(gt(S.sel)||{}).n;
 return['Cambiar prioridad',`<h2>Cambiar prioridad</h2><p><b>${esc(nm)}</b></p><p class="mut">Elige el nivel que consideras correcto.</p><div style="height:8px"></div>${['Alta','Media','Baja'].map(x=>`<button class="opt${S.pv===x?' on':''}" data-a="pv:${x}"><span><b>${x}</b>${p&&S.prop.ai===x?'<div class="mut">✨ Sugerida por la IA</div>':''}</span><i class="rd"></i></button>`).join('')}<button class="btn" style="margin-top:12px" data-a="papply">Aplicar prioridad</button><button class="btn o" data-a="back">Cancelar</button>`,{back:1}]},
alerta(){const t=gt(S.alertId)||tasks[0];if(!t)return SC.hoy();
 return['Alerta de tarea',`<div class="cen" style="padding-top:20px"><div style="width:80px;height:80px;border-radius:50%;background:#e6efff;color:#2457a6;display:flex;align-items:center;justify-content:center;margin:0 auto 12px">${ic('bell',36)}</div><div class="mut">🔔 Aviso de tarea</div><h2 style="margin:8px 0">${esc(t.n)}</h2><span class="tag ${t.df}">${t.df.toUpperCase()}</span><p class="mut" style="margin-top:12px">📅 ${due(t.d)}, ${lng(t.d)}</p></div><div style="height:110px"></div><button class="btn" data-a="tog2:${t.id}">${ic('check',15)} Marcar como hecha</button><button class="btn o" data-a="snooze">Posponer 1 hora</button><button class="btn l" data-a="det:${t.id}">Abrir tarea ↗</button>`,{back:1}]},
ia(){const i=S.ia;
 return['Nueva tarea',`<div class="mut" style="color:#2457a6;font-weight:700">✨ ASISTENTE INTELIGENTE</div><h2>Crear con IA</h2><label class="lb">¿Qué necesitas organizar?</label><textarea class="in${S.errs.t?' e':''}" rows="5" data-k="ia.text" placeholder="Ej.: Tengo parcial de Álgebra el viernes y debo preparar la presentación del lunes">${esc(i.text)}</textarea>${S.errs.t?'<div class="er">Cuéntame qué necesitas organizar</div>':''}<p class="mut">Ejemplo de uso: describe tus pendientes con tus palabras; la IA propondrá una tarea.</p><div class="mut" style="margin-top:12px">SUGERENCIAS RÁPIDAS</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px">${SUG.map((s,k)=>`<button class="tag" style="background:#eef4ff;color:#2457a6;border-color:#cfe0fb;cursor:pointer;font-size:12px;padding:5px 10px" data-a="sug:${k}">${s[0]}</button>`).join('')}</div><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" data-k="ia.auto" ${i.auto?'checked':''}> Que la IA decida dificultad y aviso</label><button class="btn" style="margin-top:16px" data-a="gen">${ic('spark',15)} Generar propuesta</button><button class="btn l" data-a="back">Cancelar</button>`,{back:1}]},
load(){return['Nueva tarea',`<div class="spin"></div><p class="cen mut">La IA está analizando tu tarea…</p>`,{}]},
iaerr(){return['Detalle de tarea',`<div class="cen" style="padding-top:24px"><div style="font-size:54px">⚠️</div><h2 style="color:#d92d20">No pudimos sugerir una prioridad</h2><p class="mut">Revisa tu conexión e intenta de nuevo, o completa la tarea a mano.</p></div><div class="hint">ℹ️ <b>No te preocupes por tu progreso</b><br>El título, la fecha de entrega y las notas de tu entrega académica siguen guardados intactos.</div><button class="btn" data-a="gen">↻ Intentar de nuevo</button><button class="btn o" data-a="manual">Completar manualmente</button><button class="btn l" data-a="back">Cancelar</button>`,{back:1}]},
prop(){const p=S.prop;
 return['Propuesta de la IA',`<h2>✨ Propuesta de la IA</h2><p class="mut">Revisa la propuesta antes de guardar.</p><div class="card" style="margin-top:10px"><b style="font-size:16px">${esc(p.n)}</b><div class="mut" style="margin:10px 0 2px">📅 Fecha límite</div><b>${fmt(p.d)}</b><div class="card" style="background:#eef4ff;margin:12px 0 8px"><div class="mut">${p.manual?'Prioridad elegida por ti:':'Prioridad sugerida por la IA:'}</div><div class="row" style="align-items:center;margin-top:6px"><span class="tag ${p.df}">${p.df}</span><span class="sp"></span><button class="btn l" style="width:auto;margin:0;padding:0" data-a="prio2">Cambiar prioridad ✎</button></div></div><div class="mut">🔔 Aviso: ${avl(p)}</div></div><button class="btn" data-a="psave">${ic('check',15)} Guardar con esta prioridad</button><button class="btn o" data-a="pedit">${ic('edit',15)} Editar</button><button class="btn l" data-a="pdis">Descartar</button>`,{back:1}]}
};
function R(){const[t,b,o]=SC[S.scr]();const sc=$('sc'),st=sc&&ls===S.scr?sc.scrollTop:0;
 $('ph').innerHTML=head(t,o)+`<div id="sc">${S.toast?`<div class="toast">✓ ${S.toast}</div>`:''}${b}</div>`+(o.nav?nav(o.nav):'')+(S.modal?modal():'');
 ls=S.scr;if(st)$('sc').scrollTop=st}
function toast(m){S.toast=m;R();clearTimeout(tm);tm=setTimeout(()=>{S.toast='';const e=document.querySelector('.toast');if(e)e.remove()},2600)}
function fin(s,m){sv();S.hist=[];S.scr=s;toast(m)}
const A={
back(){S.scr=S.hist.pop()||'hoy';R()},
go(s){S.hist.push(S.scr);S.scr=s;S.errs={};R()},
tab(s){S.hist=[];S.scr=s;R()},
tog(id){const t=gt(id);t.done=t.done?0:1;sv();R()},
tog2(id){const t=gt(id);t.done=t.done?0:1;fin('hoy',t.done?'¡Tarea completada!':'Tarea marcada como pendiente')},
det(id){S.sel=+id;A.go('detalle')},
edit(id){S.editing=+id;S.draft={...gt(id)};A.go('form')},
add(){S.editing=0;S.draft={n:'',d:'',df:'Media',av:'none'};A.go('form')},
addc(){A.add();S.draft.d=S.cal.sel;R()},
df(v){S.draft.df=v;R()},
aviso(){S.bak=[S.draft.av,S.draft.ac];A.go('aviso')},
av(v){S.draft.av=v;R()},
avc(){S.draft.av=S.bak[0];S.draft.ac=S.bak[1];A.back()},
save(){const d=S.draft;S.errs={n:!(d.n||'').trim(),d:!d.d};if(S.errs.n||S.errs.d)return R();
 if(S.editing){Object.assign(gt(S.editing),d);S.sel=S.editing;fin('detalle','Cambios guardados')}else{tasks.push({...d,n:d.n.trim(),id:nid(),done:0,est:d.est||''});fin('hoy','Tarea guardada')}},
day(k){S.cal.sel=k;R()},
cm(n){const c=S.cal;c.m+=+n;if(c.m<0){c.m=11;c.y--}if(c.m>11){c.m=0;c.y++}R()},
del(id){S.modal=+id;R()},mc(){S.modal=0;R()},
mdel(){const id=S.modal;tasks=tasks.filter(t=>t.id!=id);S.modal=0;sv();if(S.scr==='detalle')fin('hoy','Tarea eliminada');else toast('Tarea eliminada')},
prio(){S.ctx='task';S.pv=gt(S.sel).df;A.go('prio')},
prio2(){S.ctx='prop';S.pv=S.prop.df;A.go('prio')},
pv(v){S.pv=v;R()},
papply(){if(S.ctx==='prop'){S.prop.df=S.pv;S.prop.manual=S.pv!==S.prop.ai}else{gt(S.sel).df=S.pv;sv()}A.back();toast('Prioridad actualizada')},
snooze(){fin('hoy','Aviso pospuesto 1 hora')},
ia(){A.go('ia')},
sug(k){S.ia.text=SUG[k][1];R()},
gen(){if(!S.ia.text.trim()){S.errs={t:1};return R()}S.errs={};if(S.scr==='ia')S.hist.push('ia');S.scr='load';R();
 setTimeout(()=>{if(S.scr!=='load')return;if(S.fail){S.fail=false;$('fl').checked=false;S.scr='iaerr'}else{S.prop=mk(S.ia.text,S.ia.auto);S.scr='prop'}R()},1400)},
manual(){S.draft={n:S.ia.text.trim().slice(0,60),d:'',df:'Media',av:'none'};S.editing=0;S.hist=['hoy'];S.scr='form';S.errs={};R()},
psave(){const p=S.prop;tasks.push({id:nid(),n:p.n,d:p.d,df:p.df,av:p.av,ac:'',done:0,est:''});fin('hoy','Tarea guardada')},
pedit(){S.draft={n:S.prop.n,d:S.prop.d,df:S.prop.df,av:S.prop.av,ac:''};S.editing=0;A.go('form')},
pdis(){S.hist=[];S.scr='hoy';R()}
};
$('ph').addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const[a,...r]=el.dataset.a.split(':');if(A[a])A[a](r.join(':'))});
const upd=e=>{const el=e.target,k=el.dataset.k;if(!k)return;const v=el.type==='checkbox'?el.checked:el.value;if(k.indexOf('ia.')===0)S.ia[k.slice(3)]=v;else S.draft[k]=v;if(el.type==='checkbox'||el.type==='date')R()};
$('ph').addEventListener('input',upd);$('ph').addEventListener('change',upd);

const T=[['Tarea 1','Anotar una tarea con su fecha y qué tan difícil es','Toca “Añadir tarea”, llena los datos y elige un aviso.',()=>A.tab('hoy')],
['Tarea 2','Saber qué tengo que hacer primero hoy','Mira la tarjeta marcada “Empieza por esta”; marca tareas como hechas.',()=>A.tab('hoy')],
['Tarea 3','Recibir un aviso cuando se acerca la fecha','Aparece la alerta: márcala hecha, pospónla o ábrela.',()=>A.sim()],
['Tarea 4','Cambiar la fecha o la dificultad de una tarea','Toca “Editar” en una tarea y guarda los cambios.',()=>A.tab('hoy')],
['Tarea 5','Registrar una tarea con mis palabras y que la IA decida la prioridad','Escribe o usa una sugerencia y genera la propuesta.',()=>{S.hist=['hoy'];S.scr='ia';S.errs={};R()}],
['Tarea 6','Corregir la prioridad que sugirió la IA','Toca “Cambiar prioridad”, elige otra y aplícala.',()=>{S.prop={n:'Estudiar Álgebra para el parcial',d:'2026-10-30',df:'Alta',ai:'Alta',av:'2d',ac:'',manual:false};S.hist=['hoy'];S.scr='prop';R()}]];
A.sim=()=>{const t=tasks.filter(t=>!t.done&&t.av!=='none').sort((a,b)=>a.d.localeCompare(b.d))[0]||tasks[0];if(t)S.alertId=t.id;S.hist=['hoy'];S.scr='alerta';R()};
$('tl').innerHTML=T.map((t,i)=>`<button class="t" data-i="${i}"><b>${t[0]}</b>${t[1]}<br><small>${t[2]}</small></button>`).join('');
$('tl').onclick=e=>{const b=e.target.closest('.t');if(!b)return;document.querySelectorAll('.t').forEach(x=>x.classList.toggle('on',x===b));S.toast='';S.modal=0;S.hist=[];T[b.dataset.i][3]()};
$('sim').onclick=()=>{S.modal=0;A.sim()};
$('fl').onchange=e=>{S.fail=e.target.checked};
$('rs').onclick=()=>{tasks=seed();sv();S.ia={text:'',auto:true};S.modal=0;S.toast='';S.hist=[];S.scr='hoy';R()};
R();
</script></body></html>
